<!DOCTYPE html>
<html>
<head><title>Debug Los Hombres</title>
<style>
body{font-family:monospace;background:#0a1a1a;color:#2dd4bf;padding:20px}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}
pre{background:#111;padding:10px;border-radius:6px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<h2>🔍 Debug Painel Los Hombres</h2>
<div id="log"></div>
<script>
const log = (msg, type='ok') => {
  const d = document.getElementById('log');
  d.innerHTML += `<div class="${type}">[${new Date().toISOString().substr(11,8)}] ${msg}</div>`;
};

// Capturar TODOS os erros
window.onerror = (msg, src, line, col, err) => {
  log(`❌ ERRO JS: ${msg} (linha ${line}, col ${col})`, 'err');
  if(err?.stack) log(`<pre>${err.stack}</pre>`, 'err');
  return true;
};
window.addEventListener('unhandledrejection', e => {
  log(`❌ PROMISE REJEITADA: ${e.reason}`, 'err');
});

const APP_ID = '6a04cc22bf7a0dcea87e3c43';
const PROXY = `https://base44.app/api/apps/${APP_ID}/functions/adminProxy`;
const KEY = 'loshombres2026';

async function testEntity(name) {
  const url = `${PROXY}?path=${encodeURIComponent('/entities/'+name)}&limit=10`;
  const r = await fetch(url, {headers:{'x-admin-key':KEY}});
  if(!r.ok) throw new Error(`HTTP ${r.status} em ${name}`);
  const d = await r.json();
  return Array.isArray(d) ? d.length : (d.items||[]).length;
}

async function run() {
  log('Iniciando diagnóstico...');
  
  const entities = ['LeadConversa','Agendamento','SnapshotCreditos','ConfiguracaoAgente','RegraAprendizado','ConversaCliente'];
  
  const results = await Promise.allSettled(entities.map(e => testEntity(e)));
  results.forEach((r, i) => {
    if(r.status === 'fulfilled')
      log(`✅ ${entities[i]}: ${r.value} itens`);
    else
      log(`❌ ${entities[i]}: ${r.reason}`, 'err');
  });
  
  // Agora carregar o painel real dentro de um iframe para capturar erros
  log('--- Tentando carregar painel real em iframe... ---', 'warn');
  const iframe = document.createElement('iframe');
  iframe.src = 'painel_admin_v3.html';
  iframe.style.cssText = 'width:100%;height:400px;border:1px solid #2dd4bf;margin-top:10px;background:#0a1a1a';
  document.body.appendChild(iframe);
  
  iframe.addEventListener('load', () => {
    log('Iframe carregado. Tentando capturar console do iframe...', 'warn');
    try {
      const iwin = iframe.contentWindow;
      const orig = iwin.console.error.bind(iwin.console);
      iwin.console.error = (...args) => {
        log(`[iframe console.error] ${args.join(' ')}`, 'err');
        orig(...args);
      };
      // Verificar se setLoading foi chamado
      setTimeout(() => {
        try {
          const contentDiv = iwin.document.getElementById('content');
          if(contentDiv) {
            const text = contentDiv.textContent.trim();
            log(`#content no iframe: "${text.substr(0,100)}"`, text.includes('Carregando') ? 'warn' : 'ok');
          } else {
            log('⚠️ #content não encontrado no iframe', 'err');
          }
        } catch(e) { log(`Erro ao inspecionar iframe: ${e.message}`, 'err'); }
      }, 3000);
    } catch(e) { log(`Acesso ao iframe bloqueado por CORS: ${e.message}`, 'warn'); }
  });
  
  log('Diagnóstico de API concluído ✅');
}

run().catch(e => log(`Erro geral: ${e.message}`, 'err'));
</script>
</body>
</html>
